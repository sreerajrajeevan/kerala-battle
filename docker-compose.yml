# Task 11: local production simulation.
#
#   cp .env.production.example .env.production   # then fill in real values
#   docker compose up --build
#
# The app is then available at http://localhost:3001 (single origin: the
# Express server serves the built React app, the API, and Socket.IO).
#
# SQLite lives in the ./data volume (./data/kerala-battle.db on the host).
# Stop the container and start it again: the database persists.
#
# SINGLE INSTANCE: do not add `deploy.replicas` / scale this service.
# SQLite + in-memory realtime state (lobby presence, ranked queue, matches)
# means exactly one active backend. See DEPLOYMENT.md.

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: kerala-battle:local
    ports:
      - "${HOST_PORT:-3001}:3001"
    env_file:
      - .env.production
    environment:
      PORT: 3001
      DATA_DIR: /data
      SERVE_STATIC: "true"
      NODE_ENV: production
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
